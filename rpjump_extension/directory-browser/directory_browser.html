<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Directory Browser</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
      background: white;
    }

    h1 {
      font-size: 18px;
      font-weight: normal;
      margin: 0 0 20px 0;
      padding: 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .directory-listing {
      display: none;
    }

    .directory-listing.active {
      display: block;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      background: #f5f5f5;
    }

    td {
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f9f9f9;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .icon {
      display: inline-block;
      width: 20px;
      margin-right: 5px;
      text-align: center;
    }

    .parent-dir {
      font-weight: 500;
    }

    .size {
      text-align: right;
      font-family: monospace;
    }

    .date {
      font-family: monospace;
      white-space: nowrap;
    }

    .error {
      color: #d32f2f;
      padding: 20px;
      background: #ffebee;
      border-radius: 4px;
      margin: 20px 0;
    }

    .breadcrumb {
      margin-bottom: 15px;
      font-size: 14px;
      color: #666;
    }

    .breadcrumb a {
      color: #0066cc;
      cursor: pointer;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb span {
      margin: 0 5px;
    }

    /* Modal/Prompt Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 90%;
    }

    .modal-content h3 {
      margin-top: 0;
      color: #333;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      margin: 10px 0;
    }

    .modal-content input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .button-group button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .button-group button.primary {
      background: #4CAF50;
      color: white;
    }

    .button-group button.primary:hover {
      background: #45a049;
    }

    .button-group button:not(.primary) {
      background: #f5f5f5;
      color: #333;
    }

    .button-group button:not(.primary):hover {
      background: #e0e0e0;
    }

    /* Progress Overlay */
    .progress-overlay {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }

    .progress-overlay.active {
      display: flex;
    }

    .progress-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .progress-content h3 {
      margin-top: 0;
      color: #333;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-fill {
      height: 100%;
      background: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="directory-listing" id="directoryListing">
    <h1 id="directoryTitle">Index of /</h1>
    <div class="breadcrumb" id="breadcrumb"></div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Last modified</th>
          <th class="size">Size</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="fileList">
        <!-- Files will be inserted here -->
      </tbody>
    </table>
  </div>

  <!-- Tarball URL Prompt Modal -->
  <div id="tarballPrompt" class="modal">
    <div class="modal-content">
      <h3>Download Tarball</h3>
      <p>Paste a tarball URL to download and extract:</p>
      <input type="text" id="tarballNameInput" placeholder="https://example.com/archive.tar.gz" autocomplete="off">
      <div class="help-text">
        Supports .tar, .tar.gz, and .tgz formats.
      </div>
      <div class="button-group">
        <button id="cancelPromptBtn">Cancel</button>
        <button id="proceedPromptBtn" class="primary">Download</button>
      </div>
    </div>
  </div>

  <!-- Extraction Progress Overlay -->
  <div id="extractionProgress" class="progress-overlay">
    <div class="progress-content">
      <h3>Extracting Tarball...</h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">Initializing...</p>
    </div>
  </div>

  <div id="errorContainer"></div>

  <!-- External Libraries for Tarball Extraction -->
  <script src="../vendor/pako.min.js"></script>
  <script src="../vendor/untar.min.js"></script>

  <!-- Main script -->
  <script src="directory_browser.js"></script>
</body>
</html>
